name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One system failing shouldn't hide what the others would have found.
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          # The same as the release build. Ubuntu 22.04's PipeWire is too old for the screenshot library.
          - { name: Linux, os: ubuntu-24.04 }
          - { name: macOS, os: macos-latest }
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libpipewire-0.3-dev libclang-dev libxcb1-dev libwayland-dev \
            libegl-dev libgbm-dev libdrm-dev libdbus-1-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # The speech library unpacks its files here, and a rebuild from cache needs them.
          cache-directories: src-tauri/target/sherpa-onnx-prebuilt
          prefix-key: v1-rust
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # Nobody can try these two by hand yet, so this at least shows the app starts and keeps running.
      - name: Start the app on Linux
        if: runner.os == 'Linux'
        run: |
          cargo build
          status=0
          xvfb-run -a dbus-run-session -- timeout 20 target/debug/wisperchad || status=$?
          test "$status" -eq 124
      - name: Start the app on macOS
        if: runner.os == 'macOS'
        run: |
          cargo build
          target/debug/wisperchad &
          sleep 20
          kill $!
